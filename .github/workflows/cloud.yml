name: Cloud connector candidate
on:
  push:
    branches: [cloud-connector-0.4]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cloud:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - name: Synthetic cloud and authorization tests
        run: npx --no-install vitest run tests/cloud- tests/mail-authorization.test.ts tests/tool-profile.test.ts tests/dot-authorization-integration.test.ts tests/dot-regressions.test.ts tests/smtp-authorization.test.ts --maxWorkers=2 --no-file-parallelism
      - run: npm run build

name: Local Windows plugin candidate
on:
  push:
    branches: [main, local-codex-0.4.1]
  pull_request:
    branches: [main, local-codex-0.4.1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-windows:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Reject cloud source or test imports
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath src/cloud) { throw 'Cloud source is outside this local branch.' }
          if (Get-ChildItem -LiteralPath tests -Filter 'cloud*.test.ts' -Recurse) { throw 'Cloud tests are outside this local branch.' }
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - name: All local synthetic tests, including 26/17/6 tool profiles
        run: npm test -- --maxWorkers=2 --no-file-parallelism
      - run: npm run build

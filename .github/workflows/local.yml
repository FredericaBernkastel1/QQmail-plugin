name: Local Windows plugin candidate
on:
  push:
    branches: [main, local-codex-0.4.1]
  pull_request:
    branches: [main, local-codex-0.4.1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-windows:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Reject cloud source or test imports
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath src/cloud) { throw 'Cloud source is outside this local branch.' }
          if (Get-ChildItem -LiteralPath tests -Filter 'cloud*.test.ts' -Recurse) { throw 'Cloud tests are outside this local branch.' }
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - name: Use a regular local path for synthetic files
        shell: pwsh
        run: |
          # Runner TEMP may contain an 8.3 alias. Product checks deliberately
          # require the requested path to match its canonical spelling.
          $mailTestTemp = Join-Path $env:GITHUB_WORKSPACE '.ci-temp'
          New-Item -ItemType Directory -Path $mailTestTemp -Force | Out-Null
          if ((Get-Item -LiteralPath $mailTestTemp).Attributes -band [IO.FileAttributes]::ReparsePoint) { throw 'Temporary test path is redirected.' }
          "TEMP=$mailTestTemp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TMP=$mailTestTemp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: All local synthetic tests, including 29/17/6 tool profiles
        # Real PowerShell/DPAPI/path helpers can cold-start beyond Vitest's 5s
        # default on hosted Windows. Keep every assertion and a finite timeout.
        run: npm test -- --maxWorkers=1 --no-file-parallelism --testTimeout=30000
      - run: npm run build
